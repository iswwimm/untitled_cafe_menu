{% extends 'menu/base.html' %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'modifiers/css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 400px; margin: 50px auto;">
    <h2>Staff Access</h2>
    
    {% if messages %}
        {% for message in messages %}
            <div class="message message-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_password">Password:</label>
            <div class="password-input-container">
                <input type="password" id="id_password" name="password" required 
                       class="password-input"
                       autofocus>
                <button type="button" id="toggle-password" class="toggle-password-btn" title="Show password">
                    👁️
                </button>
            </div>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Enter</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('id_password');
            const toggleButton = document.getElementById('toggle-password');
            
            toggleButton.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleButton.textContent = '🙈';
                    toggleButton.title = 'Hide password';
                } else {
                    passwordInput.type = 'password';
                    toggleButton.textContent = '👁️';
                    toggleButton.title = 'Show password';
                }
            });
        });
    </script>
</div>
{% endblock %}
